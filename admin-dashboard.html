<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <link rel="stylesheet" href="css/style.css">
  <title>UrbanEye | Painel Institucional</title>
  <script>
    const savedTheme = localStorage.getItem('urbaneye_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <script>
    window.urbaneyeSupabaseUrl = window.urbaneyeSupabaseUrl || 'https://swmgwteywwtaggrznbkj.supabase.co';
    window.urbaneyeSupabaseAnonKey = window.urbaneyeSupabaseAnonKey || 'sb_publishable_0pmwIcDcS1P30gNZ3f6-3Q_MpUzhvjU';
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/auth-guard.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <header class="admin-topbar">
    <div class="logo-container">
      <img src="logo.png" class="app-logo" alt="UrbanEye">
      <div class="logo">Urban<span>Eye</span></div>
    </div>
    <div class="admin-account">
      <div><span class="small muted">Painel institucional</span><b data-admin-name>Carregando...</b></div>
      <button class="btn ghost" type="button" data-logout-button onclick="logout()">Sair</button>
    </div>
  </header>

  <main class="admin-dashboard">
    <section id="adminAccessDenied" class="card admin-denied" hidden>
      <h1>Acesso não autorizado</h1>
      <p class="muted">Esta conta não está vinculada a uma prefeitura, ONG ou equipe operacional.</p>
      <button class="btn secondary" type="button" onclick="logout()">Sair da conta</button>
    </section>

    <section id="adminDashboardContent" hidden>
      <div class="admin-heading">
        <div>
          <span class="admin-kicker">CENTRO DE OPERAÇÕES</span>
          <h1>Relatos urbanos</h1>
        </div>
        <button class="btn secondary" type="button" onclick="loadAdminReports()">Atualizar</button>
      </div>

      <div class="admin-metrics">
        <div class="admin-metric"><span>Total</span><b id="adminTotal">0</b></div>
        <div class="admin-metric"><span>Em aberto</span><b id="adminOpen">0</b></div>
        <div class="admin-metric"><span>Em análise</span><b id="adminAnalysis">0</b></div>
        <div class="admin-metric"><span>Resolvidos</span><b id="adminResolved">0</b></div>
      </div>

      <div class="admin-toolbar">
        <input id="adminSearch" type="search" placeholder="Buscar por tipo, bairro ou descrição">
        <select id="adminStatusFilter">
          <option>Todos</option>
          <option>Aberto</option>
          <option>Em análise</option>
          <option>Resolvido</option>
        </select>
      </div>

      <div id="adminReportsList" class="admin-reports"></div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
</body>
</html>
