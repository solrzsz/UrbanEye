<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../css/style.css">
  <title>UrbanEye</title>
  <script>
    // Inicializa tema escuro imediatamente para evitar flash branco
    const savedTheme = localStorage.getItem('urbaneye_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.documentElement.classList.add('auth-checking');
    setTimeout(() => document.documentElement.classList.remove('auth-checking'), 5000);
  </script>
  <script>
    window.urbaneyeSupabaseUrl = window.urbaneyeSupabaseUrl || 'https://swmgwteywwtaggrznbkj.supabase.co';
    window.urbaneyeSupabaseAnonKey = window.urbaneyeSupabaseAnonKey || 'sb_publishable_0pmwIcDcS1P30gNZ3f6-3Q_MpUzhvjU';
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../js/supabase.js"></script>
  <script defer src="../js/auth-guard.js"></script>
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="../js/data.js"></script>
  <script defer src="../js/app.js"></script>
</head>

<body>

  <!-- Header Desktop Top Nav -->
  <header class="desktop-header">
    <div class="desktop-header-inner">
      <div class="logo-container" onclick="show('home')" style="cursor:pointer">
        <img src="../images/logo.png" class="app-logo" alt="Logo">
        <div class="logo">Urban<span>Eye</span></div>
      </div>
      <div class="desktop-links">
        <button onclick="show('home')">Início</button>
        <button onclick="show('map')">Mapa</button>
        <button onclick="show('integrations')">Parcerias</button>
        <button onclick="show('ranking')">Comunidade</button>
        <button onclick="show('profile')">Perfil</button>
        <button class="btn-report" onclick="requireLogin()">＋ Reportar</button>
      </div>
    </div>
  </header>

  <div class="app">

    <section class="screen active" style="padding-bottom: 20px;">

      <div class="top"><button class="iconbtn" onclick="show('home')">‹</button>
        <div class="logo">UrbanEye</div>
        <div></div>
      </div>
      <div class="card form-card" style="margin-top:40px">
        <div style="text-align:center;margin-bottom:20px"><img src="../images/logo.png"
            style="width:80px;border-radius:20px"></div>
        <h1 style="margin:0 0 6px;text-align:center">Entrar</h1>
        <p class="muted" style="text-align:center">Entre para publicar e acompanhar seus relatos.</p>

        <div id="loginNotice" class="auth-notice" style="display:none"></div>
        <div id="savedAccountBadge" class="saved-account" style="display:none"></div>

        <div class="field"><label>E-mail</label><input id="email" type="email" placeholder="seu@email.com"></div>
        <div class="field"><label>Senha</label><input id="password" type="password" placeholder="••••••••"></div>
        <button class="auth-action auth-primary" onclick="login()" id="btnLogin">
          <span>Entrar</span><b aria-hidden="true">→</b>
        </button>
        <button class="auth-action auth-secondary" onclick="show('register')">
          <span>Criar conta</span><b aria-hidden="true">+</b>
        </button>
        <button class="auth-action auth-institutional" type="button" onclick="window.location.href='../admin/admin-login.html'">
          <span>Entrar como Prefeitura ou ONG</span><b aria-hidden="true">→</b>
        </button>
        <button class="auth-action auth-guest" onclick="enterGuestMode()">
          <span>Continuar como visitante</span>
        </button>
        <p class="small muted" style="text-align:center;margin:12px 0 0">No modo visitante, seus relatos ficam salvos apenas neste navegador.</p>
      </div>

    </section>



    <div id="toast" class="toast"></div>
  </div>


</body>

</html>
