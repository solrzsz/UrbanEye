<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../css/style.css">
  <title>UrbanEye</title>
  <script>
    // Inicializa tema escuro imediatamente para evitar flash branco
    const savedTheme = localStorage.getItem('urbaneye_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.documentElement.classList.add('auth-checking');
    setTimeout(() => document.documentElement.classList.remove('auth-checking'), 5000);
  </script>
  <script>
    window.urbaneyeSupabaseUrl = window.urbaneyeSupabaseUrl || 'https://swmgwteywwtaggrznbkj.supabase.co';
    window.urbaneyeSupabaseAnonKey = window.urbaneyeSupabaseAnonKey || 'sb_publishable_0pmwIcDcS1P30gNZ3f6-3Q_MpUzhvjU';
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../js/supabase.js"></script>
  <script defer src="../js/auth-guard.js"></script>
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="../js/data.js"></script>
    <script defer src="../js/common.js"></script>
  <script defer src="../js/pages/filter-actions.js"></script>
  <script defer src="../js/pages/map.js"></script>
</head>

<body>

  <!-- Header Desktop Top Nav -->
  <header class="desktop-header">
    <div class="desktop-header-inner">
      <div class="logo-container" onclick="show('home')" style="cursor:pointer">
        <img src="../images/logo.png" class="app-logo" alt="Logo">
        <div class="logo">Urban<span>Eye</span></div>
      </div>
      <div class="desktop-links">
        <button onclick="show('home')">Início</button>
        <button onclick="show('map')">Mapa</button>
        <button onclick="show('integrations')">Parcerias</button>
        <button onclick="show('ranking')">Comunidade</button>
        <button onclick="show('profile')">Perfil</button>
        <button class="btn-report" onclick="requireLogin()">Reportar</button>
      </div>
    </div>
  </header>

  <div class="app">

    <section class="screen active" style="padding-bottom: 78px;">

      <div class="top">
        <div>
          <div class="logo-container"><img src="../images/logo.png" class="app-logo" alt="Logo">
            <div class="logo">UrbanEye</div>
          </div>
          <div class="small muted" style="margin-left:46px">Duque de Caxias • RJ</div>
        </div><button class="iconbtn desktop-hide" onclick="show('filters')">Filtros</button>
      </div>
      <div class="map-layout">
        <div class="map-sidebar">
          <div class="card">
            <h2 style="margin:0 0 15px">Filtros</h2>
            <div class="field"><label>Categoria</label><select id="mapCategoryFilter">
                <option>Todas</option>
                <option>Buracos</option>
                <option>Iluminação</option>
                <option>Enchentes</option>
                <option>Segurança</option>
              </select></div>
            <div class="field"><label>Status</label><select id="mapStatusFilter">
                <option>Todos</option>
                <option>Aberto</option>
                <option>Em análise</option>
                <option>Resolvido</option>
              </select></div>
            <div class="field"><label>Bairro</label><select id="mapBairroFilter">
                <option>Todos os bairros</option>
                <option>Centro</option>
                <option>25 de Agosto</option>
                <option>Jardim Primavera</option>
              </select></div>
            <button class="btn" style="margin-top:15px" onclick="applyFilters()">APLICAR FILTROS</button>
          </div>
        </div>
        <div class="map-main">
          <div class="chips"><button class="chip on" onclick="filterChip(this)">Todos</button><button class="chip"
              onclick="filterChip(this)">Buracos</button><button class="chip" onclick="filterChip(this)">Iluminação</button><button class="chip" onclick="filterChip(this)">Enchentes</button><button
              class="chip" onclick="filterChip(this)">Segurança</button></div>
          <div class="map" style="background:var(--card)">
            <div id="loadingMap"
              style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;background:var(--bg)">
              <b>Carregando API...</b></div>
            <div id="realMap" style="position:absolute;inset:0;z-index:1"></div>
            <div class="mapbox">
              <div class="between"><b>Mapa de problemas</b><span id="mapCount" class="small muted">...</span></div>
              <p class="small muted" style="margin:5px 0">Toque em um marcador para ver o problema. Use sua localização
                para centralizar o mapa.</p>
              <div class="row">
                <button class="btn secondary" style="flex:1" onclick="locateUser()">Minha localização</button>
                <button class="btn" style="flex:1" onclick="show('report')">Reportar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </section>


    <div class="nav" id="nav">
      <button onclick="show('home')">Início</button>
      <button onclick="show('map')">Mapa</button>
      <button onclick="show('integrations')">Parcerias</button>
      <button class="plus" onclick="requireLogin()">+</button>
      <button onclick="show('ranking')">Comunidade</button>
      <button onclick="show('profile')">Perfil</button>
    </div>


    <div id="toast" class="toast"></div>
  </div>


</body>

</html>
