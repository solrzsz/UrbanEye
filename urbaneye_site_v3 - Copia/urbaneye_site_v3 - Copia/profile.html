<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <title>UrbanEye</title>
  <script>
    // Inicializa tema escuro imediatamente para evitar flash branco
    const savedTheme = localStorage.getItem('urbaneye_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>

<body>

  <!-- Header Desktop Top Nav -->
  <header class="desktop-header">
    <div class="desktop-header-inner">
      <div class="logo-container" onclick="show('home')" style="cursor:pointer">
        <img src="logo.png" class="app-logo" alt="Logo">
        <div class="logo">Urban<span>Eye</span></div>
      </div>
      <div class="desktop-links">
        <button onclick="show('home')">Início</button>
        <button onclick="show('map')">Mapa</button>
        <button onclick="show('integrations')">Parcerias</button>
        <button onclick="show('ranking')">Comunidade</button>
        <button onclick="show('profile')">Perfil</button>
        <button class="btn-report" onclick="requireLogin()">Reportar</button>
        
      </div>
    </div>
  </header>

  <div class="app">

    <section class="screen active" style="padding-bottom: 78px;">

      <div class="top">
        <div class="logo">Meu perfil</div><button class="iconbtn" onclick="show('settings')">⚙</button>
      </div>
      <div class="content-grid">
        <div>
          <div class="card">
            <div class="row">
              <div class="avatar" style="width:70px;height:70px;font-size:26px">V</div>
              <div>
                <h2 id="profileName" style="margin:0">Visitante</h2>
                <div id="profileMemberSince" class="muted small">Acesse sua conta para personalizar</div>
              </div>
            </div>
          </div>
          <div class="statgrid">
            <div class="stat">
              <div class="muted small">Relatos</div><b id="profileReports">0</b>
            </div>
            <div class="stat">
              <div class="muted small">Resolvidos</div><b id="profileResolved">0</b>
            </div>
            <div class="stat">
              <div class="muted small">Confirmações</div><b id="profileConfirmations">0</b>
            </div>
            <div class="stat">
              <div class="muted small">Pontos</div><b id="profilePoints">0</b>
            </div>
          </div>
          <div class="card">
            <div class="listitem" onclick="show('integrations')" style="cursor:pointer; border-bottom:0">
              <div>🔗</div>
              <div style="flex:1"><b>Apps Parceiros & Mobilidade</b>
                <div class="small muted">Conectar Moovit, Waze, etc.</div>
              </div><span>›</span>
            </div>
          </div>
          <div class="card">
            <button class="btn secondary" onclick="show('help')" style="margin-bottom:10px">❓ Ajuda e
              segurança</button>
            <button class="btn secondary" onclick="show('settings')" style="margin-bottom:10px">⚙ Configurações</button>
          </div>
        </div>
        
        <div>
          <div class="card">
            <div class="between" style="margin-bottom:10px"><b>Meus relatos (Simulação API)</b><button class="small"
                style="background:none;color:var(--primary)" onclick="show('history')">Ver todos</button></div>
            <div id="profileHistoryBox">Carregando...</div>
          </div>
        </div>
      </div>

    </section>


    <div class="nav" id="nav">
      <button onclick="show('home')">Início</button>
      <button onclick="show('map')">Mapa</button>
      <button onclick="show('integrations')">Parcerias</button>
      <button class="plus" onclick="requireLogin()">+</button>
      <button onclick="show('ranking')">Comunidade</button>
      <button onclick="show('profile')">Perfil</button>
    </div>


    <div id="toast" class="toast"></div>
  </div>

  <script>
    window.urbaneyeSupabaseUrl = window.urbaneyeSupabaseUrl || 'https://swmgwteywwtaggrznbkj.supabase.co';
    window.urbaneyeSupabaseAnonKey = window.urbaneyeSupabaseAnonKey || 'sb_publishable_0pmwIcDcS1P30gNZ3f6-3Q_MpUzhvjU';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
