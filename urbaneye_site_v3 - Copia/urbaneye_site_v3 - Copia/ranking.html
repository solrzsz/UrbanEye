<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <title>UrbanEye</title>
  <script>
    // Inicializa tema escuro imediatamente para evitar flash branco
    const savedTheme = localStorage.getItem('urbaneye_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>

<body>

  <!-- Header Desktop Top Nav -->
  <header class="desktop-header">
    <div class="desktop-header-inner">
      <div class="logo-container" onclick="show('home')" style="cursor:pointer">
        <img src="logo.png" class="app-logo" alt="Logo">
        <div class="logo">Urban<span>Eye</span></div>
      </div>
      <div class="desktop-links">
        <button onclick="show('home')">Início</button>
        <button onclick="show('map')">Mapa</button>
        <button onclick="show('integrations')">Parcerias</button>
        <button onclick="show('ranking')">Comunidade</button>
        <button onclick="show('profile')">Perfil</button>
        <button class="btn-report" onclick="requireLogin()">Reportar</button>
      </div>
    </div>
  </header>

  <div class="app">

    <section class="screen active" style="padding-bottom: 78px;">

      <div class="top">
        <div class="logo">Comunidade</div><button class="iconbtn" onclick="show('stats')">Estatísticas</button>
      </div>
      <div class="content-grid">
        <div class="card">
          <h2 style="margin:0">Ranking de bairros</h2>
          <p class="muted">Participação comunitária nesta semana.</p>
          <div class="listitem"><b style="width:20px">1</b>
            <div style="flex:1"><b>Centro</b>
              <div class="progressbar"><i style="width:88%"></i></div>
            </div><strong>88</strong>
          </div>
          <div class="listitem"><b style="width:20px">2</b>
            <div style="flex:1"><b>Jardim Primavera</b>
              <div class="progressbar"><i style="width:71%"></i></div>
            </div><strong>71</strong>
          </div>
          <div class="listitem"><b style="width:20px">3</b>
            <div style="flex:1"><b>25 de Agosto</b>
              <div class="progressbar"><i style="width:56%"></i></div>
            </div><strong>56</strong>
          </div>
        </div>
        <div class="card"><b>Seu impacto</b>
          <p class="muted">Você está entre os moradores mais ativos da semana.</p>
          <div style="display:flex; flex-direction:column; gap:12px; margin-top:16px;">
            <button class="btn secondary" onclick="show('profile')">Ver meu perfil</button>
            <button class="btn secondary" onclick="show('profile')">ONGs (Organizações Não Governamentais)</button>
          </div>
        </div>
        
      </div>

    </section>


    <div class="nav" id="nav">
      <button onclick="show('home')">Início</button>
      <button onclick="show('map')">Mapa</button>
      <button onclick="show('integrations')">Parcerias</button>
      <button class="plus" onclick="requireLogin()">+</button>
      <button onclick="show('ranking')">Comunidade</button>
      <button onclick="show('profile')">Perfil</button>
    </div>


    <div id="toast" class="toast"></div>
  </div>

  <script>
    window.urbaneyeSupabaseUrl = window.urbaneyeSupabaseUrl || 'https://swmgwteywwtaggrznbkj.supabase.co';
    window.urbaneyeSupabaseAnonKey = window.urbaneyeSupabaseAnonKey || 'sb_publishable_0pmwIcDcS1P30gNZ3f6-3Q_MpUzhvjU';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
