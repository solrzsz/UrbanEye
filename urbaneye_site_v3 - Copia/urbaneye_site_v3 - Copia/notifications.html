<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <title>UrbanEye</title>
  <script>
    // Inicializa tema escuro imediatamente para evitar flash branco
    const savedTheme = localStorage.getItem('urbaneye_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>

<body>

  <!-- Header Desktop Top Nav -->
  <header class="desktop-header">
    <div class="desktop-header-inner">
      <div class="logo-container" onclick="show('home')" style="cursor:pointer">
        <img src="logo.png" class="app-logo" alt="Logo">
        <div class="logo">Urban<span>Eye</span></div>
      </div>
      <div class="desktop-links">
        <button onclick="show('home')">Início</button>
        <button onclick="show('map')">Mapa</button>
        <button onclick="show('integrations')">Parcerias</button>
        <button onclick="show('ranking')">Comunidade</button>
        <button onclick="show('profile')">Perfil</button>
        <button class="btn-report" onclick="requireLogin()">Reportar</button>
      </div>
    </div>
  </header>

  <div class="app">

    <section class="screen active" style="padding-bottom: 78px;">

      <div class="top"><button class="iconbtn" onclick="show('home')">‹</button><b>Notificações</b><button
          class="iconbtn" onclick="toast('Tudo marcado como lido')">Marcar como lidas</button></div>
      <div class="card form-card">
        <div class="listitem">
          <div><b>Problema atualizado</b>
            <p class="small muted">Seu relato de iluminação foi marcado como resolvido via API do prefeitura.</p>
          </div>
        </div>
        <div class="listitem">
          <div><b>Novo problema perto de você</b>
            <p class="small muted">Um novo buraco foi reportado no Centro.</p>
          </div>
        </div>
        <div class="listitem">
          <div><b>Você ganhou pontos!</b>
            <p class="small muted">Sua participação ajudou a comunidade.</p>
          </div>
        </div>
      </div>

    </section>


    <div class="nav" id="nav">
      <button onclick="show('home')">Início</button>
      <button onclick="show('map')">Mapa</button>
      <button onclick="show('integrations')">Parcerias</button>
      <button class="plus" onclick="requireLogin()">+</button>
      <button onclick="show('ranking')">Comunidade</button>
      <button onclick="show('profile')">Perfil</button>
    </div>


    <div id="toast" class="toast"></div>
  </div>

  <script>
    window.urbaneyeSupabaseUrl = window.urbaneyeSupabaseUrl || 'https://swmgwteywwtaggrznbkj.supabase.co';
    window.urbaneyeSupabaseAnonKey = window.urbaneyeSupabaseAnonKey || 'sb_publishable_0pmwIcDcS1P30gNZ3f6-3Q_MpUzhvjU';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
