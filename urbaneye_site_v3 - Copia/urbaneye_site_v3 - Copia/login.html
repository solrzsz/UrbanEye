<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <title>UrbanEye</title>
  <script>
    // Inicializa tema escuro imediatamente para evitar flash branco
    const savedTheme = localStorage.getItem('urbaneye_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>

<body>

  <!-- Header Desktop Top Nav -->
  <header class="desktop-header">
    <div class="desktop-header-inner">
      <div class="logo-container" onclick="show('home')" style="cursor:pointer">
        <img src="logo.png" class="app-logo" alt="Logo">
        <div class="logo">Urban<span>Eye</span></div>
      </div>
      <div class="desktop-links">
        <button onclick="show('home')">Início</button>
        <button onclick="show('map')">Mapa</button>
        <button onclick="show('integrations')">Parcerias</button>
        <button onclick="show('ranking')">Comunidade</button>
        <button onclick="show('profile')">Perfil</button>
        <button class="btn-report" onclick="requireLogin()">＋ Reportar</button>
      </div>
    </div>
  </header>

  <div class="app">

    <section class="screen active" style="padding-bottom: 20px;">

      <div class="top"><button class="iconbtn" onclick="show('home')">‹</button>
        <div class="logo">UrbanEye</div>
        <div></div>
      </div>
      <div class="card form-card" style="margin-top:40px">
        <div style="text-align:center;margin-bottom:20px"><img src="logo.png"
            style="width:80px;border-radius:20px"></div>
        <h1 style="margin:0 0 6px;text-align:center">Entrar</h1>
        <p class="muted" style="text-align:center">Entre para publicar e acompanhar seus relatos.</p>

        <div id="savedAccountBadge" class="saved-account" style="display:none"></div>

        <div class="field"><label>E-mail</label><input id="email" type="email" placeholder="seu@email.com"></div>
        <div class="field"><label>Senha</label><input id="password" type="password" placeholder="••••••••"></div>
        <button class="btn" onclick="login()" id="btnLogin">ENTRAR</button>
        <button class="btn secondary" style="margin-top:10px" onclick="show('register')">Criar conta</button>
        <button class="btn ghost" style="margin-top:10px" onclick="show('map')">Continuar como visitante</button>
      </div>

    </section>



    <div id="toast" class="toast"></div>
  </div>

  <script>
    window.urbaneyeSupabaseUrl = window.urbaneyeSupabaseUrl || 'https://swmgwteywwtaggrznbkj.supabase.co';
    window.urbaneyeSupabaseAnonKey = window.urbaneyeSupabaseAnonKey || 'sb_publishable_0pmwIcDcS1P30gNZ3f6-3Q_MpUzhvjU';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
