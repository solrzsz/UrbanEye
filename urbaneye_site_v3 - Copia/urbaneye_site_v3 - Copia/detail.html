<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<title>UrbanEye</title>
<script>
  // Inicializa tema escuro imediatamente para evitar flash branco
  const savedTheme = localStorage.getItem('urbaneye_theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
    document.documentElement.classList.add('auth-checking');
    setTimeout(() => document.documentElement.classList.remove('auth-checking'), 5000);
</script>
  <script>
    window.urbaneyeSupabaseUrl = window.urbaneyeSupabaseUrl || 'https://swmgwteywwtaggrznbkj.supabase.co';
    window.urbaneyeSupabaseAnonKey = window.urbaneyeSupabaseAnonKey || 'sb_publishable_0pmwIcDcS1P30gNZ3f6-3Q_MpUzhvjU';
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/auth-guard.js"></script>
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>

<!-- Header Desktop Top Nav -->
<header class="desktop-header">
  <div class="desktop-header-inner">
    <div class="logo-container" onclick="show('home')" style="cursor:pointer">
      <img src="logo.png" class="app-logo" alt="Logo">
      <div class="logo">Urban<span>Eye</span></div>
    </div>
    <div class="desktop-links">
      <button onclick="show('home')">Início</button>
      <button onclick="show('map')">Mapa</button>
      <button onclick="show('integrations')">Parcerias</button>
      <button onclick="show('ranking')">Comunidade</button>
      <button onclick="show('profile')">Perfil</button>
      <button class="btn-report" onclick="requireLogin()">＋ Reportar</button>
    </div>
  </div>
</header>

<div class="app">

<section class="screen active" style="padding-bottom: 20px;">

<div class="top"><button class="iconbtn" onclick="show('map')">‹</button><b>Detalhes do problema</b><button class="iconbtn" onclick="show('map')">⋮</button></div>
<div class="content-grid">
  <div class="card"><div class="report-img" id="detailPhoto">Foto do problema</div><div class="between" style="margin-top:13px"><h2 id="detailCat" style="margin:0">Carregando...</h2><span id="detailStatus" class="status progress">-</span></div><p id="detailLoc" class="muted" style="font-size:14px;margin:8px 0">📍 Duque de Caxias</p><p id="detailDesc" style="font-size:15px">...</p>
  <div class="small muted">Publicado via API • <span id="detailConfirmCount">37</span> confirmações</div></div>
  <div>
    <div class="card"><b>Andamento</b><div style="margin:14px 0" class="progressbar"><i style="width:55%"></i></div><div class="between small"><span>Relatado</span><span>Análise</span><span>Resolvido</span></div></div>
    <div class="card"><b>Você também encontrou?</b><p class="small muted">Confirme o problema para ajudar a dar visibilidade.</p><button class="btn secondary" onclick="toast('Problema confirmado via API!')">✓ Confirmar problema</button></div>
  </div>
</div>

</section>



<div id="toast" class="toast"></div>
</div>


</body>
</html>
